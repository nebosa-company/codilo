<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <style>
      * { box-sizing: border-box; }
      html, body { width: 1920px; height: 1080px; margin: 0; overflow: hidden; }
      body {
        display: flex; flex-direction: column; align-items: center; justify-content: center;
        color: #e9f1fb;
        font-family: "Segoe UI", "Inter", system-ui, sans-serif;
        background:
          radial-gradient(1000px 620px at 50% 0%, #1d4a78 0%, transparent 65%),
          #07101d;
        position: relative;
      }
      body::before {
        content: ""; position: absolute; inset: 0;
        background-image:
          linear-gradient(rgba(125, 211, 252, 0.05) 1px, transparent 1px),
          linear-gradient(90deg, rgba(125, 211, 252, 0.05) 1px, transparent 1px);
        background-size: 72px 72px;
        mask-image: radial-gradient(ellipse at 50% 40%, #000 0%, transparent 70%);
      }
      img { width: 176px; height: 176px; filter: drop-shadow(0 24px 60px rgba(0,0,0,.55)); }
      h1 { position: relative; margin: 40px 0 0; font-size: 112px; line-height: 1; letter-spacing: -0.06em; }
      p { position: relative; margin: 30px 0 0; font-size: 34px; color: #a9bdd2; letter-spacing: 0.01em; }
      .tag { position: relative; margin-top: 54px; color: #7dd3fc; font-size: 20px; font-weight: 600; letter-spacing: 0.18em; text-transform: uppercase; }
    </style>
  </head>
  <body>
    <img src="../../../../assets/branding/codilo.svg" alt="" />
    <h1>Codilo</h1>
    <p>Small. Fast. Yours.</p>
    <div class="tag">A code editor that stays out of the way</div>
  </body>
</html>
