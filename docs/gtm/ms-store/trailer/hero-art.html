<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <style>
      * { box-sizing: border-box; }
      html, body { width: 1920px; height: 1080px; margin: 0; overflow: hidden; }
      body {
        position: relative;
        color: #e9f1fb;
        font-family: "Segoe UI", "Inter", system-ui, sans-serif;
        background:
          radial-gradient(1200px 720px at 78% 12%, #1d4a78 0%, transparent 62%),
          radial-gradient(900px 620px at 12% 92%, #0d2a46 0%, transparent 60%),
          #07101d;
      }
      body::before {
        content: "";
        position: absolute; inset: 0;
        background-image:
          linear-gradient(rgba(125, 211, 252, 0.055) 1px, transparent 1px),
          linear-gradient(90deg, rgba(125, 211, 252, 0.055) 1px, transparent 1px);
        background-size: 72px 72px;
        mask-image: radial-gradient(ellipse at 70% 30%, #000 0%, transparent 72%);
      }
      .glow {
        position: absolute; width: 900px; height: 900px; right: -220px; top: -260px;
        border-radius: 50%;
        background: radial-gradient(circle, rgba(56, 189, 248, 0.22), transparent 65%);
        filter: blur(10px);
      }
      .brand {
        position: absolute; left: 112px; top: 96px;
        display: flex; align-items: center; gap: 20px;
      }
      .brand img { width: 74px; height: 74px; filter: drop-shadow(0 12px 28px rgba(0,0,0,.45)); }
      .brand span { font-size: 34px; font-weight: 700; letter-spacing: -0.03em; }
      .copy { position: absolute; left: 112px; top: 260px; width: 660px; }
      h1 {
        margin: 0;
        font-size: 104px;
        line-height: 0.92;
        letter-spacing: -0.055em;
        font-weight: 700;
      }
      h1 em { font-style: normal; color: #7dd3fc; }
      .lede {
        margin: 30px 0 0;
        font-size: 31px;
        line-height: 1.32;
        color: #b9c8da;
        max-width: 580px;
        letter-spacing: -0.01em;
      }
      .pills { display: flex; gap: 12px; margin-top: 38px; }
      .pill {
        padding: 10px 18px;
        border: 1px solid #2b4a68;
        border-radius: 999px;
        background: rgba(10, 25, 42, 0.72);
        color: #cfe3f5;
        font-size: 17px;
        letter-spacing: 0.01em;
      }
      .art { position: absolute; left: 790px; top: 186px; width: 1180px; height: 690px; }
      .window {
        position: absolute;
        overflow: hidden;
        border: 1px solid #315270;
        border-radius: 18px;
        background: #131a24;
        box-shadow: 0 32px 90px rgba(0, 0, 0, 0.55), 0 0 0 1px rgba(125, 211, 252, 0.08);
      }
      .window img { display: block; width: 100%; height: 100%; object-fit: cover; object-position: top left; }
      .window.back { width: 980px; height: 552px; left: 130px; top: 108px; opacity: .56; transform: rotate(-3.4deg); }
      .window.front { width: 1100px; height: 620px; left: 0; top: 0; transform: rotate(1.2deg); }
      .footer {
        position: absolute; left: 112px; bottom: 74px;
        display: flex; align-items: center; gap: 18px;
        color: #8fa6bd; font-size: 20px; letter-spacing: 0.01em;
      }
      .footer strong { color: #d9e9f7; font-weight: 600; }
      .dot { width: 5px; height: 5px; border-radius: 50%; background: #4d9cf5; }
      .line {
        position: absolute; left: 112px; top: 214px; width: 76px; height: 4px;
        border-radius: 99px; background: #4d9cf5;
      }
    </style>
  </head>
  <body>
    <div class="glow"></div>
    <div class="brand">
      <img src="../../../../assets/branding/codilo.svg" alt="" />
      <span>Codilo</span>
    </div>
    <div class="line"></div>
    <div class="copy">
      <h1>A small, fast<br /><em>code editor.</em></h1>
      <p class="lede">Everything you need. Nothing you don't.<br />No account, no telemetry, no plugins.</p>
      <div class="pills">
        <span class="pill">Windows</span>
        <span class="pill">35 languages</span>
        <span class="pill">Built-in terminal</span>
      </div>
    </div>
    <div class="art">
      <div class="window back"><img src="../02-split-panes-dark.png" alt="" /></div>
      <div class="window front"><img src="../01-editor-explorer-dark.png" alt="" /></div>
    </div>
    <div class="footer">
      <strong>35 languages</strong><span class="dot"></span>
      <span>Split panes</span><span class="dot"></span>
      <span>Light and dark themes</span><span class="dot"></span>
      <span>36 interface languages</span>
    </div>
  </body>
</html>
